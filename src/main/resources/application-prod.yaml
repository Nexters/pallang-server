server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: palang

  # 1. 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  # 2. JPA 설정 (Hibernate)
  jackson:
    time-zone: Asia/Seoul
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  # 3. 캐시/세션용 Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # 4. 파일 업로드 설정 (OCR용 이미지 업로드)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 5. 네이버 클로바 OCR 연동 설정
  clova:
    ocr:
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret-key: ${CLOVA_OCR_SECRET_KEY:}

aladin:
  base-url: https://www.aladin.co.kr/ttb/api
  ttb-key: ${ALADIN_TTB_KEY:}

kakao:
  base-url: https://kapi.kakao.com
  admin-key: ${KAKAO_ADMIN_KEY:}

storage:
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:https://api.pallang.co.kr/images}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

# CORS 허용 origin (운영 도메인). api.pallang.co.kr 자신도 포함한다 — /admin 정적 페이지가
# 이 API 서버 자신에서 서빙되는데, 브라우저가 같은 오리진 요청에도 Origin 헤더를 보내는 경우(POST 등)가
# 있어 이 목록에 없으면 Spring Security의 CorsFilter가 자기 자신에 대한 fetch까지 403으로 막아버린다.
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://api.pallang.co.kr,https://www.pallang.co.kr,https://pallang.co.kr}

logging:
  level:
    root: INFO
    com.nexters.palang: INFO
