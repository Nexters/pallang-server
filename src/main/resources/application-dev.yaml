server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: palang

  # 1. 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  # 2. JPA 설정 (Hibernate)
  jackson:
    time-zone: Asia/Seoul
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      # dev는 스키마가 자주 바뀌는 실험 환경이라 자동 반영한다 (prod는 validate 유지).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  # 3. 캐시/세션용 Redis 설정
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  # 4. 파일 업로드 설정 (OCR용 이미지 업로드)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # 5. 네이버 클로바 OCR 연동 설정
  clova:
    ocr:
      invoke-url: ${CLOVA_OCR_INVOKE_URL:}
      secret-key: ${CLOVA_OCR_SECRET_KEY:}

aladin:
  base-url: https://www.aladin.co.kr/ttb/api
  ttb-key: ${ALADIN_TTB_KEY:}

# 6. CORS 허용 origin (프론트엔드와 서브도메인이 달라 브라우저 기준 다른 origin으로 취급됨)
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://dev.pallang.co.kr,https://www.pallang.co.kr,https://pallang.co.kr,http://localhost:3000}

logging:
  level:
    root: INFO
    com.nexters.palang: DEBUG
