spring:
  application:
    name: palang
  profiles:
    active: local

aladin:
  base-url: https://www.aladin.co.kr/ttb/api
  ttb-key: ${ALADIN_TTB_KEY:}

kakao:
  base-url: https://kapi.kakao.com
  admin-key: ${KAKAO_ADMIN_KEY:}

apple:
  base-url: https://appleid.apple.com
  web-client-id: ${APPLE_WEB_CLIENT_ID:}
  app-client-id: ${APPLE_APP_CLIENT_ID:}

  team-id: ${APPLE_TEAM_ID:}
  key-id: ${APPLE_KEY_ID:}
  private-key: ${APPLE_PRIVATE_KEY:}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003,http://localhost:3004,http://localhost:3005,http://localhost:3006,http://localhost:3007,http://localhost:3008,http://localhost:3009,http://localhost:3010}

jwt:
  secret: ${JWT_SECRET:local-dev-jwt-secret-key-please-change-this-01234567890123456789}
  access-token-expiration-seconds: ${JWT_ACCESS_EXPIRATION_SECONDS:3600}
  refresh-token-expiration-seconds: ${JWT_REFRESH_EXPIRATION_SECONDS:1209600}

# 이미지 업로드 저장 경로. 가비아 상용 클라우드에는 오브젝트 스토리지 상품이 없어
# 서버(Docker volume)에 직접 저장하고 /images/** 경로로 서빙한다.
# base-url: Spring 리소스 핸들러 매핑 경로(WebStorageConfig), public-base-url: 클라이언트에 내려줄 절대 URL(FileStorageService).
# 이 둘을 분리하지 않으면 base-url이 상대 경로라 클라이언트가 자기 자신의 origin 기준으로 이미지를 요청해 404가 난다.
storage:
  upload-dir: ${IMAGE_UPLOAD_DIR:./uploads}
  base-url: /images
  public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:8080/images}
