spring:
  application:
    name: palang

  # 1. 데이터베이스 설정
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}           # 예: jdbc:mysql://localhost:3306/pallang
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 2. JPA 설정 (Hibernate)
  jackson:
    time-zone: Asia/Seoul
  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update       # 테이블 자동 업데이트 (데이터 유지)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    open-in-view: false

  # 3. 파일 업로드 설정 (OCR용 이미지 업로드)
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 4. 네이버 클로바 OCR 연동 설정
clova:
  ocr:
    invoke-url: ${CLOVA_OCR_INVOKE_URL:}
    secret-key: ${CLOVA_OCR_SECRET_KEY:}