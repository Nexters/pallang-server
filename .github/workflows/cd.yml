name: CD

on:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          # ghcr.io는 이미지 이름에 대문자를 허용하지 않으므로 repository 이름을 소문자로 변환한다
          # (예: Nexters/Palang-Server -> nexters/palang-server).
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.ref_name }}-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: build-and-push
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Deploy to dev server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/pallang-server
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            # 배포 시점의 브랜치 HEAD가 아니라, 이 워크플로우를 트리거한 커밋으로 고정한다
            # (동시 배포 시 compose 소스와 이미지 태그가 어긋나는 것을 방지).
            git fetch origin
            git checkout "${IMAGE_TAG}"
            # GitHub Secrets(dev Environment)에 등록해둔 .env 전체 내용을 그대로 받아 쓴다.
            # 따옴표 처리된 heredoc이라 값 안의 $, ", ' 등을 신경 쓸 필요가 없다.
            cat > .env <<'PALANG_ENV_EOF'
            ${{ secrets.APP_ENV_FILE }}
            PALANG_ENV_EOF
            # IMAGE_TAG를 .env에도 남겨둔다. docker compose는 이 파일을 변수 치환에
            # 자동으로 쓰므로, 나중에 사람이 export 없이 수동으로 docker compose 명령을
            # 돌려도 항상 "마지막으로 CD가 배포한 태그"를 쓰게 되어 존재하지 않는
            # latest 태그로 조용히 빠지는 사고를 막는다.
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

  deploy-prod:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - name: Deploy to prod server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd ~/pallang-server
            export IMAGE_TAG=${{ needs.build-and-push.outputs.image-tag }}
            # 배포 시점의 브랜치 HEAD가 아니라, 이 워크플로우를 트리거한 커밋으로 고정한다
            # (동시 배포 시 compose 소스와 이미지 태그가 어긋나는 것을 방지).
            git fetch origin
            git checkout "${IMAGE_TAG}"
            # GitHub Secrets(prod Environment)에 등록해둔 .env 전체 내용을 그대로 받아 쓴다.
            cat > .env <<'PALANG_ENV_EOF'
            ${{ secrets.APP_ENV_FILE }}
            PALANG_ENV_EOF
            # IMAGE_TAG를 .env에도 남겨둔다 (deploy-dev와 동일한 이유).
            sed -i '/^IMAGE_TAG=/d' .env
            echo "IMAGE_TAG=${IMAGE_TAG}" >> .env
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
