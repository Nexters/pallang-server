name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

# 같은 PR에 커밋을 연달아 푸시하면 이전 실행은 의미가 없으므로 취소한다.
# develop/main push 실행은 머지 결과 검증이라 취소하지 않는다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pallang_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=2s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # application-local.yaml은 .gitignore 대상이라 CI 체크아웃본에는 존재하지 않는다.
      # 그래서 datasource/redis 값을 프로파일 파일이 아니라 Spring Boot 표준 env로 직접 주입한다.
      # 프로파일 "이름"은 그대로 local을 써야 한다 — HeaderCurrentUserProvider가 @Profile("local")로
      # 제한돼 있어서, 다른 이름(test 등)을 쓰면 CurrentUserProvider 빈을 찾지 못해
      # 컨트롤러 생성 단계에서 NoSuchBeanDefinitionException이 난다.
      - name: Build and run tests
        run: ./gradlew build
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/pallang_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
          # 마이그레이션 도구(Flyway/Liquibase) 도입 전까지, CI에서는 매 실행마다 스키마를 새로 생성한다.
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_DATA_REDIS_HOST: localhost
          SPRING_DATA_REDIS_PORT: 6379

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 5

      # Docker의 builder 스테이지(Gradle 컴파일)를 CI에서 또 돌리면 위의 "Build and run tests"와
      # 완전히 같은 컴파일이 중복 실행된다. 이미 만들어진 jar를 builder 스테이지 결과물 자리에
      # 대신 채워 넣어(--build-context로 builder 스테이지 자체를 치환) 재컴파일을 건너뛴다.
      # Dockerfile 구조는 그대로이므로 실제 배포 이미지를 빌드하는 cd.yml은 영향받지 않고 전체 빌드를 그대로 수행한다.
      #
      # develop/main push에서는 cd.yml이 같은 커밋으로 실제 이미지를 빌드하므로 이 검증은 PR에서만 돌린다.
      - name: Prepare pre-built jar for Docker builder-stage override
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p docker-builder-context/workspace/build/libs
          cp build/libs/*.jar docker-builder-context/workspace/build/libs/

      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      # GHA 캐시(cache-from/cache-to type=gha)는 쓰지 않는다.
      # - builder 스테이지를 jar로 치환한 빌드라 캐시할 가치가 있는 레이어가 없고, 캐시 export만 ~27초 걸렸다.
      # - scope를 지정하지 않으면 cd.yml과 같은 기본 scope("buildkit")를 공유해서, CI가 쓴 캐시 인덱스가
      #   CD의 캐시(gradle dependencies 레이어 등)를 덮어써 CD가 매번 의존성 다운로드부터 다시 하게 된다.
      - name: Verify Docker image builds
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: |
            builder=docker-builder-context
          push: false
          tags: pallang-ci-check:${{ github.sha }}
